# Builds the Windows installer (dist/ls6t-setup-<version>.exe) for every version tag, tests it by installing it
# silently on a clean Windows runner and running the simulator, and attaches it to the tag's GitHub release.
# Also runs by hand (Actions > installer > Run workflow): the installer is then kept as a workflow artifact.
name: installer

on:
  push:
    tags: ["20*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Build the installer
        run: python installer/build_installer.py

      - name: Install silently and test
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\ls6t-setup-*.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList "/S /CLAUDE /CODEX /GEMINI /CURSOR /CLAUDECODE /COPILOT /WINDSURF /LMSTUDIO" -Wait -PassThru
          $dir = "$env:LOCALAPPDATA\Programs\ls6t"
          if (Test-Path "$dir\install.log") { Get-Content "$dir\install.log" }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          & "$dir\bin\ls6t.cmd" --version
          if (-not (Test-Path "$dir\docs\PROMPTS.html")) { throw "docs\PROMPTS.html missing (the finish page's prompts)" }
          & "$dir\python\python.exe" -m labspec_translator.winsetup check
          if ($LASTEXITCODE -ne 0) { throw "winsetup check failed" }
          $env:LS6T_MODE = "sim"
          & "$dir\bin\ls6t.cmd" bench si_calibration graphene_map native_map | Out-File -Encoding utf8 bench.json
          $rc = $LASTEXITCODE
          $b = Get-Content bench.json -Raw | ConvertFrom-Json
          Write-Host "benchmarks passed: $($b.passed -join ', ')   failed: $($b.failed -join ', ')"
          foreach ($n in $b.failed) {
            Write-Host "== $n  (state $($b.cases.$n.state))"
            if ($b.cases.$n.error) { $b.cases.$n.error | ConvertTo-Json -Depth 6 | Write-Host }
            $b.cases.$n.checks | Where-Object { -not $_.passed } | ConvertTo-Json -Depth 4 | Write-Host
            $req = $b.cases.$n.request
            if ($req) {
              Get-ChildItem $req -Recurse -Filter "*.json" | Where-Object { $_.Name -in @("state.json") } |
                ForEach-Object { Write-Host "-- $($_.FullName)"; Get-Content $_.FullName | Write-Host }
              Get-ChildItem $req -Recurse -Filter "runner.log" | ForEach-Object { Get-Content $_.FullName -Tail 40 | Write-Host }
            }
          }
          if ($rc -ne 0) { throw "benchmarks failed: $($b.failed -join ', ')" }
          $claude = "$env:APPDATA\Claude\claude_desktop_config.json"
          $gemini = "$env:USERPROFILE\.gemini\settings.json"
          $codex = "$env:USERPROFILE\.codex\config.toml"
          $cursor = "$env:USERPROFILE\.cursor\mcp.json"
          if (-not (Get-Content $cursor | ConvertFrom-Json).mcpServers.ls6t) { throw "no ls6t entry for Cursor" }
          foreach ($f in @("$env:USERPROFILE\.claude.json", "$env:USERPROFILE\.copilot\mcp-config.json",
                           "$env:USERPROFILE\.codeium\windsurf\mcp_config.json", "$env:USERPROFILE\.lmstudio\mcp.json")) {
            if (-not (Get-Content $f -Raw | ConvertFrom-Json).mcpServers.ls6t) { throw "no ls6t entry in $f" }
          }
          if (-not (Get-Content $claude | ConvertFrom-Json).mcpServers.ls6t) { throw "no ls6t entry for Claude" }
          if (-not (Get-Content $gemini | ConvertFrom-Json).mcpServers.ls6t) { throw "no ls6t entry for Gemini CLI" }
          if (-not (Select-String -Path $codex -Pattern '^\[mcp_servers\.ls6t\]' -Quiet)) { throw "no ls6t entry for Codex" }
          Get-Content $codex
          & "$dir\bin\ls6t.cmd" connect
          & "$dir\bin\ls6t.cmd" connect check
          if ($LASTEXITCODE -ne 0) { throw "an app's ls6t entry does not start" }
          $u = Start-Process "$dir\uninstall.exe" -ArgumentList "/S" -Wait -PassThru
          Start-Sleep -Seconds 20
          if (Test-Path "$dir\python") { throw "the uninstaller left the program files" }
          if ((Get-Content $claude | ConvertFrom-Json).mcpServers.ls6t) { throw "the Claude entry is still there" }
          if (Select-String -Path $codex -Pattern '^\[mcp_servers\.ls6t\]' -Quiet) { throw "the Codex entry is still there" }

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ls6t-setup
          path: |
            dist/ls6t-setup-*
            bench.json
          if-no-files-found: ignore

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Windows installer: ls6t-setup-$tag.exe (INSTALL.md, 'The installer')."
          }
          gh release upload $tag (Get-ChildItem dist\ls6t-setup-*).FullName --clobber
